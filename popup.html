<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    /* Light theme (default) */
    :root {
      --bg: #e9eae7;
      --surface: #ffffff;
      --elevated: #f6f7f5;
      --fg: #15181a;
      --muted: #6b716e;
      --faint: #9aa09c;
      --border: rgba(20,28,22,0.10);
      --border-strong: rgba(20,28,22,0.16);
      --hover-bg: rgba(20,28,22,0.04);
      --primary: #159A45;
      --primary-fg: #ffffff;
      --accent-fg: #ffffff;
      --green-soft: rgba(21,154,69,0.12);
      --kbd: #f1f2ef;
      --kbd-border: rgba(20,28,22,0.14);
      --badge-bg: rgba(21,154,69,0.12);
      --badge-fg: #159A45;
      --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }

    [data-theme="dark"] {
      --bg: #0b0c0d;
      --surface: #161718;
      --elevated: #202223;
      --fg: #f3f4f3;
      --muted: #8b8f8d;
      --faint: #5e6361;
      --border: rgba(255,255,255,0.08);
      --border-strong: rgba(255,255,255,0.14);
      --hover-bg: rgba(255,255,255,0.05);
      --primary: #34D058;
      --primary-fg: #06140a;
      --accent-fg: #06140a;
      --green-soft: rgba(52,208,88,0.16);
      --kbd: #202223;
      --kbd-border: rgba(255,255,255,0.12);
      --badge-bg: rgba(52,208,88,0.16);
      --badge-fg: #34D058;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0b0c0d;
        --surface: #161718;
        --elevated: #202223;
        --fg: #f3f4f3;
        --muted: #8b8f8d;
        --faint: #5e6361;
        --border: rgba(255,255,255,0.08);
        --border-strong: rgba(255,255,255,0.14);
        --hover-bg: rgba(255,255,255,0.05);
        --primary: #34D058;
        --primary-fg: #06140a;
        --accent-fg: #06140a;
        --green-soft: rgba(52,208,88,0.16);
        --kbd: #202223;
        --kbd-border: rgba(255,255,255,0.12);
        --badge-bg: rgba(52,208,88,0.16);
        --badge-fg: #34D058;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      background: var(--surface);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 16px 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .logo-tile {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: #0e0f10;
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .logo {
      width: 20px;
      height: 20px;
      border-radius: 5px;
      display: block;
    }

    .app-name {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .settings-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      width: 28px;
      height: 28px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }

    .settings-btn:hover {
      background: var(--hover-bg);
      color: var(--fg);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    /* Theme toggle button */
    .theme-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      width: 28px;
      height: 28px;
      transition: background 0.15s, color 0.15s;
    }

    .theme-btn:hover {
      background: var(--hover-bg);
      color: var(--fg);
    }

    .theme-btn .t-icon {
      position: absolute;
      display: flex;
      opacity: 0;
      transform: scale(0.6) rotate(-30deg);
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .theme-btn[data-p="light"] .t-sun,
    .theme-btn[data-p="dark"]  .t-moon,
    .theme-btn[data-p="system"] .t-auto {
      opacity: 1;
      transform: scale(1) rotate(0deg);
    }

    /* Search button (primary green action) */
    .search-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: calc(100% - 32px);
      margin: 14px 16px 0;
      padding: 13px 15px;
      background: var(--primary);
      color: var(--accent-fg);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-align: left;
      transition: filter 0.15s;
    }

    .search-btn:hover { filter: brightness(1.05); }

    .search-btn-text {
      flex: 1;
      min-width: 0;
    }

    .search-btn-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .search-btn-sub {
      font-size: 11px;
      opacity: 0.72;
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .kbd-hint {
      font-size: 12px;
      font-weight: 700;
      background: rgba(0,0,0,0.16);
      border-radius: 5px;
      padding: 2px 6px;
      letter-spacing: 0.01em;
      flex-shrink: 0;
    }

    /* Batch button (ghost) */
    .batch-btn {
      display: flex;
      align-items: center;
      gap: 11px;
      width: calc(100% - 32px);
      margin: 8px 16px 0;
      padding: 11px 15px;
      background: none;
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 11px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.15s;
    }

    .batch-btn:hover { background: var(--hover-bg); }

    .batch-icon {
      color: var(--muted);
      display: flex;
    }

    .batch-label {
      flex: 1;
      text-align: left;
      font-size: 13px;
      font-weight: 500;
    }

    .count-badge {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--badge-fg);
      background: var(--badge-bg);
      border-radius: 6px;
      padding: 2px 7px;
      flex-shrink: 0;
    }

    /* Source chips */
    .chips {
      display: flex;
      gap: 6px;
      padding: 12px 16px 0;
      flex-wrap: wrap;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--elevated);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
    }

    .chip svg { flex-shrink: 0; }
    .chip .chip-num { font-family: var(--mono); }

    /* Empty hint (real button for keyboard a11y) */
    .empty-hint {
      display: block;
      width: calc(100% - 32px);
      margin: 8px 16px 0;
      padding: 11px 15px;
      font: inherit;
      font-size: 12px;
      color: var(--muted);
      background: transparent;
      border: 1px dashed var(--border-strong);
      border-radius: 11px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      text-align: center;
    }

    .empty-hint:hover,
    .empty-hint:focus-visible {
      background: var(--hover-bg);
      color: var(--fg);
      border-color: currentColor;
      outline: none;
    }

    /* Footer */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px 14px;
      margin-top: 14px;
      border-top: 1px solid var(--border);
    }

    .version {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--faint);
    }

    .shortcut-hint {
      font-size: 11px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .shortcut-hint kbd {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 19px;
      padding: 0 5px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      line-height: 1;
      background: var(--kbd);
      border: 1px solid var(--kbd-border);
      border-radius: 5px;
      color: var(--muted);
    }

    .footer-links {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .github-link {
      font-size: 11px;
      color: var(--muted);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
      border-radius: 5px;
      transition: background 0.15s, color 0.15s;
    }

    .github-link:hover {
      background: var(--hover-bg);
      color: var(--fg);
    }

    #loading {
      padding: 20px 16px;
      color: var(--muted);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <span class="logo-tile">
        <img class="logo" src="icons/icon128.png" alt="">
      </span>
      <span class="app-name">Pounce</span>
    </div>
    <div class="header-right">
      <button class="theme-btn" id="themeToggle" data-i18n-title="popup_themeTitle" title="Auto (System)">
        <!-- Sun: light mode -->
        <span class="t-icon t-sun">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </span>
        <!-- Moon: dark mode -->
        <span class="t-icon t-moon">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </span>
        <!-- Half-circle: auto/system -->
        <span class="t-icon t-auto">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 3a9 9 0 0 0 0 18V3z" fill="currentColor" stroke="none"/>
          </svg>
        </span>
      </button>
      <button class="settings-btn" id="settingsLink" data-i18n-title="popup_settingsTitle" title="Settings">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Loading -->
  <div id="loading" data-i18n="popup_loading">Loading...</div>

  <!-- Has URLs state -->
  <div id="hasUrls" style="display:none;">
    <button class="search-btn" id="searchBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <span class="search-btn-text">
        <span class="search-btn-title" data-i18n="popup_searchTabsBookmarks">Search Tabs &amp; Bookmarks</span>
        <span class="search-btn-sub" data-i18n="popup_searchSources">tabs · bookmarks · history · top sites</span>
      </span>
      <span class="kbd-hint">⌘K</span>
    </button>

    <button class="batch-btn" id="openAllBtn">
      <span class="batch-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
      </span>
      <span class="batch-label" data-i18n="popup_batchOpenURLs">Batch Open URLs</span>
      <span class="count-badge" id="urlCount"></span>
    </button>

    <!-- Source chips -->
    <div class="chips">
      <span class="chip">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z"/><path d="M3 8h18"/>
        </svg>
        <span class="chip-num" id="tabsCount">0</span> <span data-i18n="popup_chipTabs">tabs</span>
      </span>
      <span class="chip">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1Z"/>
        </svg>
        <span class="chip-num" id="savedCount">0</span> <span data-i18n="popup_chipSaved">saved</span>
      </span>
      <span class="chip">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3v5h5"/><path d="M3.05 13a9 9 0 1 0 2.6-6.36L3 8"/><path d="M12 7v5l4 2"/>
        </svg>
        <span class="chip-num" id="recentCount">0</span> <span data-i18n="popup_chipRecent">recent</span>
      </span>
    </div>
  </div>

  <!-- Empty state -->
  <div id="emptyState" style="display:none;">
    <button class="search-btn" id="searchBtnEmpty">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <span class="search-btn-text">
        <span class="search-btn-title" data-i18n="popup_searchTabsBookmarks">Search Tabs &amp; Bookmarks</span>
        <span class="search-btn-sub" data-i18n="popup_searchSources">tabs · bookmarks · history · top sites</span>
      </span>
      <span class="kbd-hint">⌘K</span>
    </button>

    <button type="button" class="empty-hint" id="emptyHintBtn" data-i18n="popup_addUrls">+ Add URLs for batch open</button>
  </div>

  <!-- Footer -->
  <div class="footer">
    <span class="version" id="versionText">—</span>
    <div class="footer-links">
      <a class="github-link" href="https://github.com/TuYv/pounce" target="_blank" rel="noopener noreferrer" data-i18n-title="popup_starTitle" title="Star on GitHub">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/>
        </svg>
        <span data-i18n="popup_star">Star</span>
      </a>
      <a class="github-link" href="https://github.com/TuYv/pounce/issues/new" target="_blank" rel="noopener noreferrer" data-i18n-title="popup_reportTitle" title="Report an issue">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M8 1.25a6.75 6.75 0 1 0 0 13.5A6.75 6.75 0 0 0 8 1.25ZM2.75 8a5.25 5.25 0 1 1 10.5 0 5.25 5.25 0 0 1-10.5 0ZM8 4.25a.75.75 0 0 1 .75.75v3.25a.75.75 0 0 1-1.5 0V5A.75.75 0 0 1 8 4.25Zm0 7a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"/>
        </svg>
        <span data-i18n="popup_issue">Issue</span>
      </a>
    </div>
    <span class="shortcut-hint"><span data-i18n="popup_openSearchHint">anywhere</span> <kbd>Alt+K</kbd></span>
  </div>

  <script src="i18n.js"></script>
  <script src="theme-manager.js"></script>
  <script src="popup.js"></script>
</body>
</html>
